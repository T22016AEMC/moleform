# 推送到 main 時自動型別檢查、測試、建置並部署到 GitHub Pages。
# 測試沒通過就不部署（deploy 工作需要 build 工作成功）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/ketcher-frame/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/ketcher-frame
      - run: npm run typecheck
      - run: npm run test:clean
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 暫停：D62，本機版不以部署為目標。要恢復時移除下一行的 if: false。
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
